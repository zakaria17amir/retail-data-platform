retail:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '') or '../data/warehouse/retail.duckdb' }}"
      threads: 4
      settings:
        TimeZone: UTC
      extensions:
        - httpfs
        - delta
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ROOT_USER', 'minio') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD', 'minio12345') }}"
          endpoint: "{{ (env_var('MINIO_ENDPOINT', '') or 'http://127.0.0.1:9000').split('://')[-1] }}"
          region: us-east-1
          url_style: path
          use_ssl: false
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', '') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', '') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', '') }}"
      schema: gold
      threads: 4
