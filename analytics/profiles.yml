retail:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '') or '../data/warehouse/retail.duckdb' }}"
      threads: 4
      # external marts land at <external_root>/<model>.parquet
      external_root: "{{ env_var('GOLD_DIR', '') or '../data/gold' }}"
      settings:
        TimeZone: UTC
      extensions:
        - httpfs
        - delta
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ROOT_USER', 'minio') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD', 'minio12345') }}"
          endpoint: "{{ (env_var('MINIO_ENDPOINT', '') or 'http://127.0.0.1:9000').split('://')[-1] }}"
          region: us-east-1
          url_style: path
          use_ssl: false
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      # DBT_SERVICE is a TYPE=SERVICE user: key-pair only. Set exactly one of the key (PEM or
      # base64 DER, the CI secret) or a key file path.
      user: "{{ env_var('SNOWFLAKE_USER', '') or 'DBT_SERVICE' }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', '') or 'TRANSFORMER' }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', '') or 'RETAIL_WH' }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', '') or 'RETAIL' }}"
      schema: gold
      threads: 4
