name: retail
version: "0.1.0"
config-version: 2
profile: retail

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  retail:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: "{{ 'external' if target.type == 'duckdb' else 'table' }}"
      +schema: marts
