name: retail
version: "0.1.0"
config-version: 2
profile: retail

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  retail:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: "{{ 'external' if target.type == 'duckdb' else 'table' }}"
      +schema: marts
    ml:
      +materialized: "{{ 'external' if target.type == 'duckdb' else 'table' }}"
      +schema: ml
      # rendered by the external materialization, where `this` exists: <external_root>/ml/<name>.parquet
      +location: "{% raw %}{{ adapter.external_root() }}/ml/{{ this.identifier[3:] }}.parquet{% endraw %}"
      # DuckDB's COPY creates no parent directory; an empty partitioned COPY creates <external_root>/ml
      +pre-hook: "{% if target.type == 'duckdb' %}copy (select 1 as k, 1 as v where false) to '{{ adapter.external_root() }}/ml' (format parquet, partition_by (k), overwrite_or_ignore true){% endif %}"
