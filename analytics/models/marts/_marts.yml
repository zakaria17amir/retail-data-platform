models:
  - name: dim_date
    description: Calendar day spine 2016-01-01..2019-12-31; also the MetricFlow time spine.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [not_null, unique]

  - name: dim_customer
    description: >
      SCD2 customer versions (deleted versions kept). customer_sk = surrogate of
      customer_id + valid_from; is_first_version extends a key's first version back in time so
      point-in-time joins never drop facts.
    columns:
      - name: customer_sk
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null]
      - name: customer_zip_code_prefix
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: zip_code_prefix
              config:
                severity: warn

  - name: dim_product
    description: SCD2 product versions with English category (deleted versions kept).
    columns:
      - name: product_sk
        data_tests: [not_null, unique]
      - name: product_id
        data_tests: [not_null]

  - name: dim_seller
    description: SCD2 seller versions (deleted versions kept).
    columns:
      - name: seller_sk
        data_tests: [not_null, unique]
      - name: seller_id
        data_tests: [not_null]
      - name: seller_zip_code_prefix
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: zip_code_prefix
              config:
                severity: warn

  - name: dim_geo
    description: One centroid per zip code prefix (mean lat/lng, most frequent state).
    columns:
      - name: zip_code_prefix
        data_tests: [not_null, unique]

  - name: dim_payment_type
    description: Distinct payment types seen in order payments.
    columns:
      - name: payment_type
        data_tests: [not_null, unique]

  - name: fct_orders
    description: >
      Grain order (all statuses). customer_sk is the customer version valid at purchase time;
      lifecycle measures from int_order_lifecycle; is_revenue_order excludes canceled/unavailable,
      deleted and item-less orders; is_delivered/is_late exclude deleted orders.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk
      - name: order_purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_order_items
    description: >
      Grain order item unit. product_sk/seller_sk are the versions valid at order purchase time;
      item_revenue = price + freight_value.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_id
        data_tests: [not_null]
      - name: product_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sk
      - name: seller_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_sk
      - name: order_purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_payments
    description: Grain order payment.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: payment_sequential
        data_tests: [not_null]
      - name: payment_type
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type

  - name: fct_reviews
    description: Grain review record (review_pk; Olist review_id is not unique).
    columns:
      - name: review_pk
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: review_creation_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_sessions
    description: Grain clickstream session, anonymous sessions included.
    columns:
      - name: session_id
        data_tests: [not_null, unique]
      - name: session_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: order_id
        description: Streamed events can land before the order reaches silver, hence warn.
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
              config:
                severity: warn

  - name: fct_events
    description: Daily event aggregate by event_date and event_type.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_date, event_type]
    columns:
      - name: event_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: event_type
        data_tests: [not_null]

unit_tests:
  - name: fct_orders_point_in_time_customer
    description: >
      Before a key's first version -> first version; after a change -> new version; after a
      delete -> the deleted version. No order is lost or duplicated.
    model: fct_orders
    given:
      - input: ref('int_order_lifecycle')
        rows:
          - {order_id: o_before_first, customer_id: cb, order_purchase_ts_utc: "2017-01-01 00:00:00+00"}
          - {order_id: o_before_change, customer_id: ca, order_purchase_ts_utc: "2017-02-01 00:00:00+00"}
          - {order_id: o_at_change, customer_id: ca, order_purchase_ts_utc: "2017-03-01 00:00:00+00"}
          - {order_id: o_after_change, customer_id: ca, order_purchase_ts_utc: "2017-05-01 00:00:00+00"}
          - {order_id: o_after_delete, customer_id: cd, order_purchase_ts_utc: "2017-09-01 00:00:00+00"}
      - input: ref('int_customer_orders')
        rows:
          - {order_id: o_before_first}
          - {order_id: o_before_change}
          - {order_id: o_at_change}
          - {order_id: o_after_change}
          - {order_id: o_after_delete}
      - input: ref('dim_customer')
        rows:
          - {customer_sk: cb_v1, customer_id: cb, valid_from: "2017-06-01 00:00:00+00", valid_to: null, is_first_version: true, is_deleted: false}
          - {customer_sk: ca_v1, customer_id: ca, valid_from: "1900-01-01 00:00:00+00", valid_to: "2017-03-01 00:00:00+00", is_first_version: true, is_deleted: false}
          - {customer_sk: ca_v2, customer_id: ca, valid_from: "2017-03-01 00:00:00+00", valid_to: null, is_first_version: false, is_deleted: false}
          - {customer_sk: cd_v1, customer_id: cd, valid_from: "1900-01-01 00:00:00+00", valid_to: "2017-08-01 00:00:00+00", is_first_version: true, is_deleted: false}
          - {customer_sk: cd_v2, customer_id: cd, valid_from: "2017-08-01 00:00:00+00", valid_to: null, is_first_version: false, is_deleted: true}
    expect:
      rows:
        - {order_id: o_before_first, customer_sk: cb_v1}
        - {order_id: o_before_change, customer_sk: ca_v1}
        - {order_id: o_at_change, customer_sk: ca_v2}
        - {order_id: o_after_change, customer_sk: ca_v2}
        - {order_id: o_after_delete, customer_sk: cd_v2}

  - name: fct_order_items_point_in_time_product_and_seller
    description: Product changed after the order; seller's only versions start after the order and end deleted.
    model: fct_order_items
    given:
      - input: ref('stg_order_items')
        rows:
          - {order_id: o1, order_item_id: 1, product_id: p1, seller_id: s1, price: 10.00, freight_value: 2.50}
      - input: ref('int_order_lifecycle')
        rows:
          - {order_id: o1, order_purchase_ts_utc: "2017-04-01 00:00:00+00", is_revenue_order: true}
      - input: ref('dim_product')
        rows:
          - {product_sk: p1_v1, product_id: p1, valid_from: "1900-01-01 00:00:00+00", valid_to: "2017-05-01 00:00:00+00", is_first_version: true}
          - {product_sk: p1_v2, product_id: p1, valid_from: "2017-05-01 00:00:00+00", valid_to: null, is_first_version: false}
      - input: ref('dim_seller')
        rows:
          - {seller_sk: s1_v1, seller_id: s1, valid_from: "2017-06-01 00:00:00+00", valid_to: "2017-07-01 00:00:00+00", is_first_version: true, is_deleted: false}
          - {seller_sk: s1_v2, seller_id: s1, valid_from: "2017-07-01 00:00:00+00", valid_to: null, is_first_version: false, is_deleted: true}
    expect:
      rows:
        - {order_id: o1, order_item_id: 1, product_sk: p1_v1, seller_sk: s1_v1, item_revenue: 12.50, is_revenue_order: true}
