models:
  - name: rpt_daily_sales
    description: >
      Grain purchase date (local) x customer state. Revenue = sum(price + freight_value) of
      revenue-order items; orders = distinct revenue orders; aov = revenue / orders.
    config:
      cluster_by: [order_purchase_date]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_purchase_date, customer_state]
    columns:
      - name: customer_state
        data_tests: [not_null]
      - name: order_purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: revenue
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: aov
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: rpt_customer_360
    description: >
      Grain customer_unique_id, customers with at least one revenue order. Recency in days from
      the last revenue order to the latest purchase date in the data; frequency = revenue orders;
      monetary = ltv = revenue; orders counts all statuses. Scores 1-5 (5 = best) are tie-safe:
      recency and monetary by percent_rank bucket (1 + floor(5 * percent_rank), capped at 5),
      frequency by fixed thresholds 1 -> 1, 2 -> 3, 3 -> 4, >= 4 -> 5.
    config:
      cluster_by: [customer_unique_id]
    columns:
      - name: customer_unique_id
        data_tests: [not_null, unique]
      - name: monetary
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: recency_score
        data_tests: &rfm_score
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: frequency_score
        data_tests: *rfm_score
      - name: monetary_score
        data_tests: *rfm_score

  - name: rpt_product_performance
    description: >
      Grain product_id x purchase month over revenue-order items: units, revenue, average review
      score of the orders and late rate of their delivered orders (each order counted once).
    config:
      cluster_by: [order_month]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, order_month]
    columns:
      - name: product_id
        data_tests: [not_null]
      - name: order_month
        data_tests: [not_null]
      - name: revenue
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: late_rate
        data_tests: &unit_interval
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: rpt_funnel
    description: >
      Grain session date: sessions (anonymous included) and sessions reaching product_view,
      add_to_cart and checkout_started; conversion_rate = checkout sessions / sessions.
    config:
      cluster_by: [session_date]
    columns:
      - name: session_date
        data_tests: [not_null, unique]
      - name: conversion_rate
        data_tests: *unit_interval

  - name: rpt_delivery_sla
    description: >
      Grain purchase month x customer state over delivered (not deleted) orders: delivered, late
      (delivered after the estimate), late_rate = late / delivered, average purchase-to-customer
      hours.
    config:
      cluster_by: [order_month]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_month, customer_state]
    columns:
      - name: customer_state
        data_tests: [not_null]
      - name: order_month
        data_tests: [not_null]
      - name: late_rate
        data_tests: *unit_interval

  - name: rpt_data_quality
    description: >
      Silver data quality history: one row per run/table/rule from _rule_metrics (micro-batch
      rows summed; pct recomputed from the sums) and per run/table/expectation from _dq_results
      (success), told apart by check_type.
    config:
      cluster_by: [checked_at]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [check_type, run_id, table_name, check_name]
    columns:
      - name: check_type
        data_tests:
          - accepted_values:
              arguments:
                values: [silver_rule, dq_expectation]
      - name: run_id
        data_tests: [not_null]
      - name: pct_rejected
        description: Percent (0-100) of rows_in rejected by the rule.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100

  - name: rpt_recommendation_ctr
    description: >
      Grain event date (local) x model_version x strategy over fct_recommendations: shown,
      clicked, ctr = clicked / shown (metric recommendation_ctr) and ctr_at_k = clicked / shown
      among items at rank <= k, for k = 1, 2, 3.
    config:
      cluster_by: [event_date]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_date, model_version, strategy]
    columns:
      - name: event_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: ctr
        data_tests: *unit_interval
      - name: ctr_at_1
        data_tests: *unit_interval
      - name: ctr_at_2
        data_tests: *unit_interval
      - name: ctr_at_3
        data_tests: *unit_interval

unit_tests:
  - name: rpt_recommendation_ctr_per_model_and_rank
    description: >
      ctr = clicked / shown per date, model_version and strategy (null model_version is its own
      group); ctr_at_k counts only ranks <= k and is null without such impressions.
    model: rpt_recommendation_ctr
    given:
      - input: ref('fct_recommendations')
        rows:
          - {event_date: "2017-01-01", model_version: "3", strategy: rerank, rank: 1, is_clicked: true}
          - {event_date: "2017-01-01", model_version: "3", strategy: rerank, rank: 1, is_clicked: false}
          - {event_date: "2017-01-01", model_version: "3", strategy: rerank, rank: 2, is_clicked: false}
          - {event_date: "2017-01-01", model_version: "3", strategy: rerank, rank: 2, is_clicked: false}
          - {event_date: "2017-01-01", model_version: "3", strategy: rerank, rank: 3, is_clicked: true}
          - {event_date: "2017-01-01", model_version: "3", strategy: rerank, rank: 4, is_clicked: true}
          - {event_date: "2017-01-01", model_version: "3", strategy: rerank, rank: 4, is_clicked: false}
          - {event_date: "2017-01-01", model_version: "3", strategy: rerank, rank: 4, is_clicked: false}
          - {event_date: "2017-01-01", model_version: null, strategy: global_popularity, rank: 5, is_clicked: false}
          - {event_date: "2017-01-02", model_version: "3", strategy: rerank, rank: 1, is_clicked: false}
    expect:
      rows:
        - {event_date: "2017-01-01", model_version: "3", strategy: rerank, shown: 8, clicked: 3, ctr: 0.375, ctr_at_1: 0.5, ctr_at_2: 0.25, ctr_at_3: 0.4}
        - {event_date: "2017-01-01", model_version: null, strategy: global_popularity, shown: 1, clicked: 0, ctr: 0.0, ctr_at_1: null, ctr_at_2: null, ctr_at_3: null}
        - {event_date: "2017-01-02", model_version: "3", strategy: rerank, shown: 1, clicked: 0, ctr: 0.0, ctr_at_1: 0.0, ctr_at_2: 0.0, ctr_at_3: 0.0}


  - name: rpt_data_quality_rule_metrics_summed_per_run
    description: >
      The silver job writes one _rule_metrics row per micro-batch; two batches of one
      run/table/rule become one row with summed counts and the pct recomputed from the sums.
    model: rpt_data_quality
    given:
      - input: ref('stg_rule_metrics')
        rows:
          - {run_id: r1, table_name: orders, rule_id: not_null_pk, rows_in: 100, rows_rejected: 10, pct_rejected: 10.0, run_ts: "2017-01-01 10:00:00+00"}
          - {run_id: r1, table_name: orders, rule_id: not_null_pk, rows_in: 300, rows_rejected: 10, pct_rejected: 3.33, run_ts: "2017-01-01 10:05:00+00"}
          - {run_id: r1, table_name: orders, rule_id: valid_status, rows_in: 0, rows_rejected: 0, pct_rejected: null, run_ts: "2017-01-01 10:00:00+00"}
      - input: ref('stg_dq_results')
        rows: []
    expect:
      rows:
        - {check_type: silver_rule, run_id: r1, table_name: orders, check_name: not_null_pk, rows_in: 400, rows_rejected: 20, pct_rejected: 5.0, checked_at: "2017-01-01 10:05:00+00"}
        - {check_type: silver_rule, run_id: r1, table_name: orders, check_name: valid_status, rows_in: 0, rows_rejected: 0, pct_rejected: null, checked_at: "2017-01-01 10:00:00+00"}

  - name: rpt_customer_360_equal_customers_get_equal_scores
    description: >
      u_a and u_b have identical recency/frequency/monetary and must share every score;
      frequency uses fixed thresholds, recency/monetary percent_rank buckets; u_e has no
      revenue order and is excluded but still sets the as-of date.
    model: rpt_customer_360
    given:
      - input: ref('fct_orders')
        rows:
          - {order_id: a1, customer_unique_id: u_a, is_revenue_order: true, item_revenue: 100, order_purchase_date: "2018-01-10", order_purchase_ts_utc: "2018-01-10 12:00:00+00"}
          - {order_id: b1, customer_unique_id: u_b, is_revenue_order: true, item_revenue: 100, order_purchase_date: "2018-01-10", order_purchase_ts_utc: "2018-01-10 12:00:00+00"}
          - {order_id: c1, customer_unique_id: u_c, is_revenue_order: true, item_revenue: 200, order_purchase_date: "2018-05-01", order_purchase_ts_utc: "2018-05-01 12:00:00+00"}
          - {order_id: c2, customer_unique_id: u_c, is_revenue_order: true, item_revenue: 300, order_purchase_date: "2018-06-01", order_purchase_ts_utc: "2018-06-01 12:00:00+00"}
          - {order_id: d1, customer_unique_id: u_d, is_revenue_order: true, item_revenue: 10, order_purchase_date: "2018-02-01", order_purchase_ts_utc: "2018-02-01 12:00:00+00"}
          - {order_id: d2, customer_unique_id: u_d, is_revenue_order: true, item_revenue: 10, order_purchase_date: "2018-02-02", order_purchase_ts_utc: "2018-02-02 12:00:00+00"}
          - {order_id: d3, customer_unique_id: u_d, is_revenue_order: true, item_revenue: 10, order_purchase_date: "2018-02-03", order_purchase_ts_utc: "2018-02-03 12:00:00+00"}
          - {order_id: d4, customer_unique_id: u_d, is_revenue_order: true, item_revenue: 10, order_purchase_date: "2018-02-04", order_purchase_ts_utc: "2018-02-04 12:00:00+00"}
          - {order_id: e1, customer_unique_id: u_e, is_revenue_order: false, item_revenue: 0, order_purchase_date: "2018-06-02", order_purchase_ts_utc: "2018-06-02 12:00:00+00"}
    expect:
      rows:
        - {customer_unique_id: u_a, orders: 1, frequency: 1, monetary: 100, recency_days: 143, recency_score: 1, frequency_score: 1, monetary_score: 2}
        - {customer_unique_id: u_b, orders: 1, frequency: 1, monetary: 100, recency_days: 143, recency_score: 1, frequency_score: 1, monetary_score: 2}
        - {customer_unique_id: u_c, orders: 2, frequency: 2, monetary: 500, recency_days: 1, recency_score: 5, frequency_score: 3, monetary_score: 5}
        - {customer_unique_id: u_d, orders: 4, frequency: 4, monetary: 40, recency_days: 118, recency_score: 4, frequency_score: 5, monetary_score: 1}
