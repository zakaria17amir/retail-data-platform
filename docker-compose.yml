name: retail

# retail-ml monitor overrides for airflow and ml-cli; empty = the image's documented default
x-monitor-env: &monitor-env
  DRIFT_SHARE_THRESHOLD: ${DRIFT_SHARE_THRESHOLD:-}
  REFERENCE_SAMPLE_ROWS: ${REFERENCE_SAMPLE_ROWS:-}
  MIN_CURRENT_ROWS: ${MIN_CURRENT_ROWS:-}
  MIN_LABELLED: ${MIN_LABELLED:-}
  MIN_POSITIVES: ${MIN_POSITIVES:-}
  MONITOR_WINDOW_DAYS: ${MONITOR_WINDOW_DAYS:-}
  MONITOR_TAIL_RATIO: ${MONITOR_TAIL_RATIO:-}
  MONITORING_REPORT_ROOT: ${MONITORING_REPORT_ROOT:-}

services:
  postgres:
    profiles: [core, ingest, demo, analytics, ml, realtime, genai]
    # bookworm, like the postgres:16.6 image the volume was created with: same glibc collations
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [retail]

  minio:
    profiles: [core, ingest, analytics, ml, realtime, genai]
    # Silo (pgsty), maintained MinIO fork; minio/minio was removed from Docker Hub, see ADR-0002
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [retail]

  minio-init:
    profiles: [core, ingest, analytics, ml, realtime, genai]
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$LAKEHOUSE_BUCKET"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [retail]

  redpanda:
    profiles: [ingest, demo, realtime]
    image: redpandadata/redpanda:v26.2.3@sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:${REDPANDA_PORT:-19092}
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
      - "127.0.0.1:${SCHEMA_REGISTRY_PORT:-18081}:18081"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1500m
    networks: [retail]

  redpanda-console:
    profiles: [ingest]
    image: redpandadata/console:v3.12.0@sha256:9dc0cd55db172c6be9c2ff8a51f33a14395f7675fa7fbc002c277f3b96115c27
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    configs:
      - source: console_config
        target: /etc/console/config.yaml
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8080}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [retail]

  kafka-connect:
    profiles: [ingest]
    build: ingestion/debezium
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda:9092
      CONNECT_GROUP_ID: retail-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://redpanda:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://redpanda:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      KAFKA_HEAP_OPTS: -Xms256m -Xmx1g
    ports:
      - "127.0.0.1:${CONNECT_PORT:-8083}:8083"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1500m
    networks: [retail]

  connect-init:
    profiles: [ingest]
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    depends_on:
      kafka-connect:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./ingestion/debezium:/debezium:ro
    entrypoint: ["sh", "/debezium/register.sh"]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [retail]

  spark:
    profiles: [ingest]
    build: lakehouse/spark
    command: ["spark-submit", "/opt/lakehouse/src/lakehouse_spark/bronze/app.py"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      BRONZE_RUN_ID: ${BRONZE_RUN_ID:-}
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./lakehouse/spark:/opt/lakehouse:ro
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    networks: [retail]

  replayer:
    profiles: [demo]
    build:
      context: .
      dockerfile: ingestion/replayer/Dockerfile
    command: ["live", "--loop"]
    environment:
      OLIST_DATA_DIR: /data/olist
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REPLAY_SPEED: ${REPLAY_SPEED:-3600}
    volumes:
      - type: bind
        source: ${OLIST_DATA_DIR}
        target: /data/olist
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [retail]

  clickstream-sim:
    profiles: [demo]
    build:
      context: .
      dockerfile: ingestion/clickstream_sim/Dockerfile
    command: ["run"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REPLAY_SPEED: ${REPLAY_SPEED:-3600}
      SIM_LATE_RATE: ${SIM_LATE_RATE:-0.05}
      SIM_LATE_MAX_HOURS: ${SIM_LATE_MAX_HOURS:-48}
      SIM_DUP_RATE: ${SIM_DUP_RATE:-0.01}
      SIM_BAD_RATE: ${SIM_BAD_RATE:-0.0}
      SIM_SCHEMA_EVOLVE_AFTER: ${SIM_SCHEMA_EVOLVE_AFTER:-0}
      SIM_BROWSING_RATIO: ${SIM_BROWSING_RATIO:-3}
      SIM_SEED: ${SIM_SEED:-42}
      # used only by `run --feedback`; a failed call skips feedback
      RECOMMEND_URL: http://serving:8000
      CLICK_BASE: ${CLICK_BASE:-0.3}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [retail]

  airflow-init:
    profiles: [analytics]
    build: orchestration
    image: retail-airflow:3.3.2
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    entrypoint:
      - bash
      - -euc
      - |
        : "$${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}"
        : "$${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}"
        python -c '
        import os, psycopg2
        c = psycopg2.connect(host="postgres", user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"], dbname=os.environ["POSTGRES_DB"])
        c.autocommit = True
        cur = c.cursor()
        cur.execute("select 1 from pg_database where datname = %s", ("airflow",))
        if cur.fetchone() is None:
            cur.execute("create database airflow")
        '
        airflow db migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [retail]

  airflow:
    profiles: [analytics]
    build: orchestration
    image: retail-airflow:3.3.2
    # standalone forces SimpleAuthManager; seeding its passwords file stops it generating a random admin password
    command:
      - bash
      - -euc
      - |
        : "$${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}"
        : "$${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}"
        : "$${HOST_REPO_DIR:?set HOST_REPO_DIR in .env (PWD is not exported by this shell)}"
        (umask 077 && python -c 'import json, os; print(json.dumps({"admin": os.environ["AIRFLOW_ADMIN_PASSWORD"]}))' \
          > "$$AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE")
        airflow pools set ml 1 "serialise ml jobs (feast file registry)"
        airflow pools set llm 1 "serialise llm jobs (one GPU, Ollama swaps chat and embed)"
        exec airflow standalone
    environment:
      # monitor overrides reach the retail-ml tasks only when non-empty (ml_common.PASSTHROUGH); GIT_SHA
      # is left out, so ML tasks log the SHA baked into the image
      <<: [*airflow-env, *monitor-env]
      # LocalExecutor pre-forks one worker per parallelism slot (default 32), too much for the 2g limit
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      # host path of the repo: DockerOperator bind mounts are resolved by the host daemon, not this container
      HOST_REPO_DIR: ${HOST_REPO_DIR:-$PWD}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # browser-facing URL for log links; the execution API default derives from it, so pin that to the in-container port
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8088}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
      MINIO_ENDPOINT: http://minio:9000
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      BRONZE_FRESHNESS_HOURS: ${BRONZE_FRESHNESS_HOURS:-24}
      GOLD_MIN_INTERVAL_HOURS: ${GOLD_MIN_INTERVAL_HOURS:-20}
      # absolute: Cosmos runs dbt from a temp copy of the project, so the ../data defaults would break
      DUCKDB_PATH: /opt/airflow/data/warehouse/retail.duckdb
      GOLD_DIR: /opt/airflow/data/gold
      # train DAGs pass it as --promotion-mode to the retail-ml containers
      PROMOTION_MODE: ${PROMOTION_MODE:-auto}
      # monitor breaches retrain at most once per cooldown
      RETRAIN_COOLDOWN_HOURS: ${RETRAIN_COOLDOWN_HOURS:-72}
      # genai DAGs (retail-agents containers): proxy key, enrich sample (empty = CLI default 500), eval size
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      ENRICH_LIMIT: ${ENRICH_LIMIT:-}
      EVAL_LIMIT: ${EVAL_LIMIT:-20}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8088}:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./analytics:/opt/airflow/analytics
      - ./data:/opt/airflow/data
      - ./lakehouse:/opt/airflow/lakehouse
      - /var/run/docker.sock:/var/run/docker.sock # root-equivalent host access; local dev only
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [retail]

  mlflow-init:
    profiles: [ml, realtime, genai]
    build:
      context: ml
      dockerfile: mlflow.Dockerfile
    image: retail-mlflow:3.16.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - python
      - -c
      - |
        import os, psycopg2
        c = psycopg2.connect(host="postgres", user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"], dbname=os.environ["POSTGRES_DB"])
        c.autocommit = True
        cur = c.cursor()
        cur.execute("select 1 from pg_database where datname = %s", ("mlflow",))
        if cur.fetchone() is None:
            cur.execute("create database mlflow")
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [retail]

  mlflow:
    profiles: [ml, realtime, genai]
    build:
      context: ml
      dockerfile: mlflow.Dockerfile
    image: retail-mlflow:3.16.1
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --artifacts-destination
      - s3://${LAKEHOUSE_BUCKET}/mlflow
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "2"
      # host validation rejects the compose service name by default (only localhost + private IPs)
      - --allowed-hosts
      - mlflow,mlflow:5000,localhost,localhost:5000,localhost:${MLFLOW_PORT:-5000},127.0.0.1,127.0.0.1:${MLFLOW_PORT:-5000}
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # the GenAI job runner forks ~7 huey consumers (~1.3 GB); tracking and the registry don't need it
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [retail]

  redis:
    profiles: [ml, realtime, genai]
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # candidates + Feast online rows; noeviction: a full store fails writes loudly instead of
    # silently dropping candidate lists
    command: ["redis-server", "--maxmemory", "640mb", "--maxmemory-policy", "noeviction",
              "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [retail]

  serving:
    profiles: [ml, realtime, genai]
    build: &ml-build
      context: ml
      args:
        # baked as ENV GIT_SHA (MLflow lineage tag); `make ml-build` / `make ml` pass the short HEAD
        GIT_SHA: ${GIT_SHA:-unknown}
    image: retail-ml
    # image ENTRYPOINT is retail-ml (DockerOperator, ml-cli); reset so the command can be uvicorn
    entrypoint: []
    # 4 workers share Prometheus mmap files; a restart must not inherit a dead worker's counters.
    # POST /reload reloads only the worker that handles it: to switch the champion on all 4,
    # `docker compose --profile ml restart serving`
    command:
      - sh
      - -ec
      - >-
        rm -rf "$$PROMETHEUS_MULTIPROC_DIR" && mkdir -p "$$PROMETHEUS_MULTIPROC_DIR" &&
        exec uvicorn retail_ml.serving.app:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      <<: &ml-env
        MLFLOW_TRACKING_URI: http://mlflow:5000
        REDIS_URL: redis://redis:6379/0
        FEAST_REPO_PATH: /feature_repo
        FEAST_REGISTRY_PATH: /data/feast/registry.db
        GOLD_DIR: /data/gold
        PROMOTION_MODE: ${PROMOTION_MODE:-auto}
      # serving only (not ml-cli): Feast reads the first, prometheus_client the second
      PROMETHEUS_MULTIPROCESS_DIR: /tmp/prometheus
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    ports:
      - "127.0.0.1:${SERVING_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
      - ./ml/feature_repo:/feature_repo
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    # contract with T5: /health is liveness, 200 even with no model loaded (body says model_loaded=false),
    # so `make up PROFILE=ml` (--wait) succeeds on a fresh stack with an empty registry
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m  # 4 workers ≈ 0.9 GiB idle (≈ 230 MiB each)
    networks: [retail]

  ml-cli:
    profiles: [ml]
    build: *ml-build
    image: retail-ml
    # one-off batch commands only (`make ml ARGS=…`): scale 0 keeps `up` from starting it, `run` still works
    scale: 0
    entrypoint: ["retail-ml"]
    environment:
      <<: [*ml-env, *monitor-env]
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./data:/data
      - ./ml/feature_repo:/feature_repo
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 3g  # train recommender peaks at 1.98 GiB on the full history
    networks: [retail]

  # topic and DDL need different clients (rpk, psql), so two one-shot inits
  realtime-init:
    profiles: [realtime]
    image: redpandadata/redpanda:v26.2.3@sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9
    entrypoint: ["rpk", "topic", "create", "ml.late_delivery_scores", "--if-not-exists", "-X", "brokers=redpanda:9092"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [retail]

  realtime-sql-init:
    profiles: [realtime]
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/sql/realtime.sql"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./sql:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [retail]

  feast-server:
    profiles: [realtime]
    build: *ml-build
    image: retail-ml
    entrypoint: ["feast"]
    # 2 workers and no gunicorn recycling (--max-requests 0): pushes never hit a restarting worker
    command: ["-c", "/feature_repo", "serve", "-h", "0.0.0.0", "-p", "6566", "-w", "2", "--max-requests", "0"]
    environment:
      <<: *ml-env
      # `feast serve` substitutes REDIS_URL raw into feature_store.yaml: Feast connection format
      REDIS_URL: "redis:6379,db=0"
    ports:
      - "127.0.0.1:${FEAST_PORT:-6566}:6566"
    volumes:
      - ./data/feast:/data/feast
      - ./ml/feature_repo:/feature_repo
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6566/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [retail]

  stream-score:
    profiles: [realtime]
    build: *ml-build
    image: retail-ml
    command: ["stream-score"]
    environment:
      <<: *ml-env
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STREAM_BATCH_ROWS: ${STREAM_BATCH_ROWS:-500}
      STREAM_BATCH_SECONDS: ${STREAM_BATCH_SECONDS:-5}
    ports:
      - "127.0.0.1:${STREAM_SCORE_PORT:-8001}:8001"
    volumes:
      - ./data:/data
      - ./ml/feature_repo:/feature_repo
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
      realtime-init:
        condition: service_completed_successfully
      realtime-sql-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [retail]

  spark-realtime:
    profiles: [realtime]
    build: lakehouse/spark
    image: retail-spark
    command: ["spark-submit", "/opt/lakehouse/src/lakehouse_spark/realtime/app.py"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
      FEAST_SERVER_URL: http://feast-server:6566
      SESSION_WATERMARK: ${SESSION_WATERMARK:-48 hours}
      POPULARITY_WATERMARK: ${POPULARITY_WATERMARK:-49 hours}
    volumes:
      - ./lakehouse/spark:/opt/lakehouse:ro
    depends_on:
      minio:
        condition: service_healthy
      feast-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4040/api/v1/applications"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g  # driver 2g + 512m overhead from spark-defaults.conf
    networks: [retail]

  litellm:
    profiles: [genai]
    image: ghcr.io/berriai/litellm:v1.101.0@sha256:d295634e09c648dcdb72c4cc2dd226f5fb87823a73e88cbbed6f205e4deb044b
    # runtime guard, not `:?` interpolation, which would fail `docker compose` for every profile
    entrypoint:
      - sh
      - -euc
      - |
        : "$${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}"
        exec litellm --config /app/config.yaml --host 0.0.0.0 --port 4000
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # bundled model cost map: no fetch from GitHub on every start
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    # Docker Desktop resolves host.docker.internal itself; Linux engines need the mapping
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [retail]

  chainlit:
    profiles: [genai]
    # context is the repo root: agents depends on ../genai through a path dependency
    build:
      context: .
      dockerfile: agents/Dockerfile
    image: retail-agents
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      # LangGraph checkpointer (schema agents); the Chainlit thread id is the checkpointer thread
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RAG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # restricted order-writer role created by sql/shop.sql
      SHOP_DSN: postgresql://shop_writer:shop_writer@postgres:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RECOMMEND_URL: http://serving:8000
      # product titles from Delta silver/product_enriched (falls back to category names if absent)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET}
      # default "Customer id" chat setting of the Shopping profile (a real Olist customer in gold)
      DEMO_CUSTOMER_ID: ${DEMO_CUSTOMER_ID:-3ce436f183e68e07877b285a838db11a}
      GOLD_DIR: /app/data/gold
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./data/gold:/app/data/gold:ro
      # semantic_manifest.json + manifest.json for MetricFlow and get_model_docs
      - ./analytics/target:/app/analytics/target:ro
    depends_on:
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [retail]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [retail]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/serving.json
    # runtime guard, not `:?` interpolation, which would fail `docker compose` for every profile
    entrypoint:
      - sh
      - -euc
      - |
        : "$${GF_SECURITY_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
        exec /run.sh
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [retail]

configs:
  console_config:
    content: |
      kafka:
        brokers: ["redpanda:9092"]
      schemaRegistry:
        enabled: true
        urls: ["http://redpanda:8081"]
      kafkaConnect:
        enabled: true
        clusters:
          - name: debezium
            url: http://kafka-connect:8083

volumes:
  pgdata:
  miniodata:
  redpandadata:
  redisdata:

networks:
  retail:
