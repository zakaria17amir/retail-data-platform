[project]
name = "clickstream-sim"
version = "0.1.0"
description = "Synthetic clickstream derived from Olist orders"
requires-python = ">=3.12,<3.13"
dependencies = [
  "confluent-kafka[avro]",
  "polars",
  "psycopg[binary]",
  "python-dotenv",
]

[project.scripts]
clickstream-sim = "clickstream_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clickstream_sim"]
