[project]
name = "agents"
version = "0.1.0"
description = "LangGraph agents: core, analytics agent, shopping assistant, evals, Chainlit UI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.12",
  "langgraph-checkpoint-postgres==3.1.2",
  "langchain-openai==1.6.6",
  "litellm==1.102.1",
  "psycopg[binary]==3.3.6",
  "mlflow==3.16.1",
  "duckdb==1.5.5",
  "pytz==2026.4",
  "sqlglot==30.19.0",
  "matplotlib==3.11.2",
  "chainlit==2.12.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "metricflow==0.213.0",
]

[project.scripts]
agents = "agents.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
  "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.uv]
exclude-newer = "2026-09-27T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
