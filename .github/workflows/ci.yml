name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --group dev
      - run: make lint
      - run: make test
      # local manifest in analytics/target/ is what the DAG tests (Cosmos DBT_MANIFEST) load
      - run: make dbt-parse
      - run: make sqlfluff
      - env:
          CI: "true"
        run: uv run --locked --project orchestration pytest orchestration/tests
      # ml is a separate uv project (own lock): unit tests incl. the synthetic metric floor + API contract
      - run: uv run --locked --project ml ruff check ml
      - run: uv run --locked --project ml mypy --config-file ml/pyproject.toml ml/src
      - run: uv run --locked --project ml pytest ml
      # genai and agents are separate uv projects too (agents has genai as a path dependency). No
      # Ollama here: the LLM is mocked (LiteLLM mock_response, fake chat model, fake embedder) and
      # the pgvector/Postgres tests skip without RAG_DSN / POSTGRES_DSN
      - run: uv run --locked --project genai ruff check genai
      - run: uv run --locked --project genai mypy --config-file genai/pyproject.toml genai/src
      - run: uv run --locked --project genai pytest genai -rs
      - run: uv run --locked --project agents ruff check agents
      - run: uv run --locked --project agents mypy --config-file agents/pyproject.toml agents/src
      - run: uv run --locked --project agents pytest agents -rs

  integration:
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --group dev
      - run: cp .env.example .env
      - run: make up
      - run: make seed-sample
      - run: make status | tee status.txt
      - run: |
          grep -q '^orders: 200$' status.txt
      - run: make test-integration
      - if: failure()
        run: docker compose --profile core logs --tail 50
      - if: always()
        run: make down

  ingest:
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --group dev
      - run: |
          cp .env.example .env
          echo OLIST_DATA_DIR=tests/fixtures/olist_sample >> .env
          # build arg of retail-ml, as `make ml-build` passes it
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      # tags match Compose's default image names (project "retail"), so `make up` reuses these builds;
      # serving = the retail-ml image (`make ml-build`), built here for the GHA cache
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: kafka-connect,spark,replayer,clickstream-sim,serving,mlflow
          load: true
          set: |
            mlflow.cache-from=type=gha,scope=mlflow
            mlflow.cache-to=type=gha,scope=mlflow,mode=max
            serving.tags=retail-ml
            serving.cache-from=type=gha,scope=retail-ml
            serving.cache-to=type=gha,scope=retail-ml,mode=max
            kafka-connect.tags=retail-kafka-connect
            kafka-connect.cache-from=type=gha,scope=kafka-connect
            kafka-connect.cache-to=type=gha,scope=kafka-connect,mode=max
            spark.tags=retail-spark
            spark.cache-from=type=gha,scope=spark
            spark.cache-to=type=gha,scope=spark,mode=max
            replayer.tags=retail-replayer
            replayer.cache-from=type=gha,scope=replayer
            replayer.cache-to=type=gha,scope=replayer,mode=max
            clickstream-sim.tags=retail-clickstream-sim
            clickstream-sim.cache-from=type=gha,scope=clickstream-sim
            clickstream-sim.cache-to=type=gha,scope=clickstream-sim,mode=max
      # connect-init needs publication olist_cdc, created by `replayer seed`
      - run: make up
      - run: make seed-sample
      # before `up PROFILE=ingest` to keep memory down; test-ingest later runs `make silver`
      # beside the bronze app (~13.3 GiB of container limits on the 16 GiB runner)
      - run: make test-spark
      - run: make up PROFILE=ingest
      - env:
          PYTEST_ADDOPTS: "-rs --strict-markers"
        run: |
          set -o pipefail
          ALLOW_RESEED=1 make test-ingest | tee ingest.txt
          grep -q ' passed' ingest.txt && ! grep -q ' skipped' ingest.txt
      # silver now holds the sample; build runs the data and unit tests (warn severity does not fail)
      - run: make gold
      - run: cd analytics && uv run dbt test --select test_type:unit
      # retail-ml image on the sample gold with a file-based MLflow (sqlite + local artefacts in the
      # container, no server). The default split keeps both classes in val (41 orders, 4 late) and test
      # (41, 6) on the 200-order sample; promotion is not asserted.
      - name: smoke train late_delivery
        env:
          SMOKE_CHECK: |
            import os
            import mlflow
            c = mlflow.MlflowClient()
            runs = c.search_runs([c.get_experiment_by_name("late_delivery").experiment_id])
            types = sorted(r.data.tags["model_type"] for r in runs)
            assert types == ["constant_prior", "lightgbm", "logistic"], types
            shas = {r.data.tags["git_sha"] for r in runs}
            assert shas == {os.environ["EXPECTED_SHA"]}, shas
            model = mlflow.pyfunc.load_model("models:/late_delivery/1")
            print("runs", types, "git_sha", shas, "model", model.metadata.model_id)
        run: >-
          docker compose run --rm --no-deps -w /tmp
          -e SMOKE_CHECK -e EXPECTED_SHA="$GIT_SHA"
          -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow.db -e FEAST_REGISTRY_PATH=/tmp/registry.db
          --entrypoint sh ml-cli -ec 'retail-ml train late_delivery && python -c "$SMOKE_CHECK"'
      # realtime e2e on the same stack (cheaper than a job that rebuilds bronze/silver/gold): sample
      # champions (manual promotion: deterministic) and candidates, then PROFILE=realtime, whose
      # serving loads the champions at start. ml-cli runs as uid 1000, the runner is not
      - name: realtime champions and candidates
        run: |
          mkdir -p data/feast && chmod -R a+rwX data
          docker compose --profile realtime up -d --wait mlflow redis
          ml() { docker compose run --rm ml-cli "$@"; }
          ml train late_delivery --promotion-mode manual
          ml promote late_delivery --version 1
          ml materialize
          uv run --package clickstream-sim clickstream-sim generate
          ml train recommender --promotion-mode manual
          ml promote recommender --version 1
          ml publish-candidates
      - run: make up PROFILE=realtime
      - env:
          PYTEST_ADDOPTS: "-rsP --strict-markers"
        run: |
          set -o pipefail
          ALLOW_RESEED=1 uv run pytest -m realtime tests/integration | tee realtime.txt
          grep -q ' passed' realtime.txt && ! grep -q ' skipped' realtime.txt
      - if: failure()
        run: docker compose --profile ingest --profile realtime logs --tail 100
      - if: always()
        run: make down
