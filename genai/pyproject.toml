[project]
name = "genai"
version = "0.1.0"
description = "GenAI batch jobs: LLM catalogue enrichment and the hybrid RAG index"
requires-python = ">=3.12,<3.13"
dependencies = [
  "litellm==1.102.1",
  "pydantic==2.13.5",
  "deltalake==1.6.6",
  "pyarrow==25.0.1",
  "pandas==3.0.6",
  "psycopg[binary]==3.3.6",
  "pgvector==0.5.0",
  "mlflow-skinny==3.16.1",
]

[project.scripts]
genai = "genai.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
  "mypy==2.3.1",
  "pandas-stubs==3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai"]

[tool.uv]
exclude-newer = "2026-09-27T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
