[project]
name = "retail-data-platform"
version = "0.1.0"
description = "End-to-end retail data platform"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "pre-commit", "fastavro"]

[tool.uv.workspace]
members = ["ingestion/replayer", "ingestion/clickstream_sim", "lakehouse/spark"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
markers = [
  "integration: needs running Compose services",
  "spark: needs a SparkSession (run inside the spark container)",
  "ingest: needs the ingest profile and reseeds the database",
]
testpaths = ["ingestion", "lakehouse"]
