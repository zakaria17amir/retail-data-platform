[project]
name = "retail-ml"
version = "0.1.0"
description = "Batch ML and MLOps: features, Feast repo, training, promotion, serving, monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightgbm==4.7.0",
  "scikit-learn==1.9.1",
  "mlflow==3.16.1",
  "feast[redis]==0.66.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "prometheus-client==0.24.1",
  "evidently==0.7.23",
  "shap==0.52.0",
  "pandas==2.3.3",
  "pyarrow==25.0.1",
  "boto3==1.43.103",
  "pyyaml==6.0.3",
  "implicit==0.7.3",
]

[project.scripts]
retail-ml = "retail_ml.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "locust==2.46.6",
  "ruff==0.16.9",
  "mypy==2.3.1",
  "pandas-stubs>=2.3,<2.4",
  "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_ml"]

[tool.uv]
exclude-newer = "2026-09-27T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
  "sklearn", "sklearn.*", "lightgbm", "lightgbm.*", "pyarrow", "pyarrow.*",
  "scipy", "scipy.*", "implicit", "implicit.*", "threadpoolctl",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
