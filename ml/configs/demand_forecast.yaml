# 28-day demand forecast per product_category x customer_state. Paths are relative to GOLD_DIR.
# Test window = the last 28 days of demand_daily; backtest folds = the 28-day blocks before it.
experiment: demand_forecast
registered_model: demand_forecast
demand_path: ml/demand_daily.parquet
output_path: ml/pred_demand_forecast.parquet
backtest_folds: 3
top_series: 10
lightgbm:
  objective: poisson  # counts: non-negative by construction, no clipping
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  random_state: 42
  deterministic: true
  verbose: -1
