[project]
name = "lakehouse-spark"
version = "0.1.0"
description = "Spark bronze ingestion app"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pyspark==4.0.4",
  "delta-spark==4.0.1",
  "deltalake",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_spark"]
