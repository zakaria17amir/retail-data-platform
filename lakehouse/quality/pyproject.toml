[project]
name = "lakehouse-quality"
version = "0.1.0"
description = "Great Expectations quality gates on the silver layer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "great-expectations==1.23.2",
  "deltalake",
  "pandas",
  "pyarrow",
]

[dependency-groups]
dev = ["pandas-stubs==3.0.5.260914"]

[project.scripts]
quality = "lakehouse_quality.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_quality"]
